[workspace]
resolver = "3"
members = ["crates/mycelium", "crates/mycelium-layout", "crates/mycelium-i18n", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mycelium-i18n = { path = "crates/mycelium-i18n" }
mycelium-layout = { path = "crates/mycelium-layout" }

eframe = { version = "0.36", default-features = false, features = [
    "wgpu_no_default_features",
    "default_fonts",
    "accesskit",
    "persistence",
    "wayland",
    "x11",
] }
egui = { version = "0.36", default-features = false }
# Собираем только Vulkan-бэкенд: весь интерфейс рисуется через Vulkan.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "vulkan"] }
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"
sys-locale = "0.3"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
