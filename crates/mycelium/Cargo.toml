[package]
name = "mycelium"
description = "Forma Mycelium — среда разработки модов для Minecraft"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo не разрешает пробел в имени бинарника; «Forma Mycelium.exe» собирает `cargo xtask dist`.
[[bin]]
name = "forma-mycelium"
path = "src/main.rs"

[dependencies]
mycelium-i18n.workspace = true
mycelium-layout.workspace = true
mycelium-project.workspace = true
mycelium-log.workspace = true
eframe.workspace = true
wgpu.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
env_logger.workspace = true
# Подсветка кода: синтаксисы из набора bat (через two-face), как в Forma: Holotype.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

[build-dependencies]
embed-resource = "3.0.12"
