[package]
name = "mycelium"
description = "Forma Mycelium — среда разработки модов для Minecraft"
version.workspace = true
edition.workspace = true
license.workspace = true

# Cargo не разрешает пробел в имени бинарника; «Forma Mycelium.exe» собирает `cargo xtask dist`.
[[bin]]
name = "forma-mycelium"
path = "src/main.rs"

[dependencies]
forma-i18n.workspace = true
forma-layout.workspace = true
forma-ui.workspace = true
forma-actions.workspace = true
forma-settings.workspace = true
forma-plugins.workspace = true
# Фоновая картинка окна.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
mycelium-project.workspace = true
mycelium-log.workspace = true
mycelium-hyphae.workspace = true
eframe.workspace = true
wgpu.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
env_logger.workspace = true
# Подсветка кода: синтаксисы из набора bat (через two-face), как в Forma: Holotype.
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }

# Своя шапка окна: скругление углов окна без системной рамки в Windows 11.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[build-dependencies]
embed-resource = "3.0.12"
# Иконка .exe собирается из рисунков в assets/logo.
image = { version = "0.25", default-features = false, features = ["webp"] }
